kind: pipeline
type: docker
name: verify-and-deploy

clone:
  depth: 0

concurrency:
  limit: 1

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vip_champ_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: vip_champ_test

steps:
  - name: verify
    image: python:3.13-slim-trixie
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://vip_champ_test:test-only-password@postgres:5432/vip_champ_test
    commands:
      - sh scripts/install_pg_client.sh
      - apt-get install -y --no-install-recommends git
      - export PATH=/usr/lib/postgresql/16/bin:$PATH
      - pip install --require-hashes -r requirements-dev.txt
      - python scripts/check_secrets.py --history
      - ruff check .
      - python -m pytest -q
      - pip-audit --disable-pip --no-deps -r requirements.txt
      - pip-audit --disable-pip --no-deps -r requirements-dev.txt

  - name: build-preview
    image: plugins/docker
    settings:
      dry_run: true
      repo: vip-champ
      tags:
        - ${DRONE_COMMIT_SHA}
      build_args:
        - APP_REVISION=${DRONE_COMMIT_SHA}
    depends_on:
      - verify
    when:
      event:
        - pull_request
        - custom

  - name: build-branch
    image: plugins/docker
    settings:
      dry_run: true
      repo: vip-champ
      tags:
        - ${DRONE_COMMIT_SHA}
      build_args:
        - APP_REVISION=${DRONE_COMMIT_SHA}
    depends_on:
      - verify
    when:
      event:
        - push
      branch:
        exclude:
          - master

  - name: build
    image: plugins/docker
    settings:
      registry: git.smartsoltech.kr
      repo: git.smartsoltech.kr/trevor/vip-champ
      config:
        from_secret: vip_champ_registry_config
      tags:
        - ${DRONE_COMMIT_SHA}
      build_args:
        - APP_REVISION=${DRONE_COMMIT_SHA}
    depends_on:
      - verify
    when:
      event:
        - push
      branch:
        - master
      repo:
        - trevor/vip_champ

  - name: export-image
    image: alpine:3.22
    environment:
      REGISTRY_CONFIG:
        from_secret: vip_champ_registry_config
    commands:
      - apk add --no-cache skopeo python3
      - python3 scripts/export_image.py
    depends_on:
      - build
    when:
      event:
        - push
      branch:
        - master
      repo:
        - trevor/vip_champ

  - name: deploy
    image: alpine:3.22
    environment:
      DEPLOY_HOST:
        from_secret: vip_champ_deploy_host
      DEPLOY_USER:
        from_secret: vip_champ_deploy_user
      DEPLOY_SSH_KEY:
        from_secret: vip_champ_deploy_key
      DEPLOY_KNOWN_HOSTS:
        from_secret: vip_champ_deploy_known_hosts
      DEPLOY_PATH:
        from_secret: vip_champ_deploy_path
      TELEGRAM_API_TOKEN:
        from_secret: vip_champ_telegram_api_token
    commands:
      - apk add --no-cache git openssh-client
      - sh scripts/ci_deploy.sh
    depends_on:
      - export-image
    when:
      event:
        - push
      branch:
        - master
      repo:
        - trevor/vip_champ

trigger:
  event:
    - push
    - pull_request
    - custom
