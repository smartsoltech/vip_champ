name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vip_champ_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: vip_champ_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_champ_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vip_champ_test:test-only-password@localhost:5432/vip_champ_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo sh scripts/install_pg_client.sh
      - run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python scripts/check_secrets.py --history
      - run: ruff check .
      - run: python -m pytest -q
      - run: pip-audit --disable-pip --no-deps -r requirements.txt
      - run: pip-audit --disable-pip --no-deps -r requirements-dev.txt
      - run: docker build --build-arg APP_REVISION="$GITHUB_SHA" --tag vip-champ:ci .
