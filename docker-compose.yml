services:
  telegram-bot:
    image: ${APP_IMAGE:-vip-champ:${APP_REVISION:-development}}
    pull_policy: never
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-development}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_REVISION: ${APP_REVISION:-development}
      BACKUP_DIR: /app/db/backups
      HEARTBEAT_PATH: /app/db/heartbeat.json
    volumes:
      - ${DB_HOST_DIR:-./db}:/app/db
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

